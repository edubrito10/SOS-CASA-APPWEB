<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Cliente</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: url('fundo.png') no-repeat center center fixed;
      background-size: cover;
    }

    .header {
      background-color: #4b12ea;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .logout-btn {
      background-color: #f1e2cd;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn:hover {
      background-color: #e0d1bb;
    }

    .container {
      max-width: 95%;
      margin: 20px auto;
      background-color: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    .perfil p {
      margin: 10px 0;
      font-size: 15px;
    }

    h2 {
      margin-top: 0;
      color: #333;
      font-size: 20px;
    }

    .avatar-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .avatar-container img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ccc;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 18px;
        width: 100%;
        margin-bottom: 10px;
      }

      .logout-btn {
        font-size: 14px;
        padding: 6px 12px;
      }

      h2 {
        font-size: 18px;
      }

      .perfil p {
        font-size: 14px;
      }

      .avatar-container img {
        width: 110px;
        height: 110px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Perfil do Cliente</h1>
    <button class="logout-btn" onclick="history.back()">Voltar</button>
  </div>

  <div class="container">
    <div class="perfil">
      <div class="avatar-container">
        <img id="avatar-img" src="images/user.png" alt="Avatar do Cliente">
      </div>
      <p><strong>Nome:</strong> <span id="nome"></span></p>
      <p><strong>Localidade:</strong> <span id="localidade"></span></p>
      <p><strong>Morada:</strong> <span id="morada"></span></p>
      <p><strong>Telefone:</strong> <span id="telefone"></span></p>
      <p><strong>Email:</strong> <span id="email"></span></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    const supabase = window.supabase.createClient(
      'https://fqshqdfhmptuvjskptzl.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxc2hxZGZobXB0dXZqc2twdHpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY0NzcxNzEsImV4cCI6MjA2MjA1MzE3MX0.YuDcyfe8v6ff4Y88GuNjDV-CsLz_k1AM4c49ozk-RdY'
    );

    async function carregarPerfilCliente() {
      const params = new URLSearchParams(window.location.search);
      const clienteId = params.get('id');

      if (!clienteId) {
        alert('ID do cliente não encontrado na URL.');
        return;
      }

      const { data, error } = await supabase
        .from('profiles')
        .select('nome, localidade, morada, telemovel, email, avatar_url')
        .eq('id', clienteId)
        .single();

      if (error || !data) {
        alert('Erro ao carregar o perfil!');
        console.error(error);
        return;
      }

      document.getElementById('nome').textContent = data.nome || "";
      document.getElementById('localidade').textContent = data.localidade || "";
      document.getElementById('morada').textContent = data.morada || "";
      document.getElementById('telefone').textContent = data.telemovel || "";
      document.getElementById('email').textContent = data.email || "";

      const avatarImg = document.getElementById("avatar-img");
      if (data.avatar_url) {
        avatarImg.src = data.avatar_url + `?t=${Date.now()}`;
      }
    }

    carregarPerfilCliente();
  </script>
</body>
</html>
