<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Cliente - SOS Casa</title>
  <meta name="theme-color" content="#4f0fff" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/compromise@13.11.3/builds/compromise.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: url('images/fundo.png') no-repeat center center fixed;
      background-size: cover;
    }
    header {
      background-color: #4f0fff;
      color: white;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }
    .nav-left {
      font-weight: bold;
      font-size: 18px;
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }
    .logout-btn {
      border: 2px solid white;
      background: none;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .logout-btn:hover {
      background-color: white;
      color: #4f0fff;
    }
    h2 {
      text-align: center;
      margin-top: 30px;
      font-size: 24px;
    }
    .services-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 20px;
    }
    .service-btn {
      background-color: #4f0fff;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .service-btn:hover {
      transform: scale(1.05);
    }
    .pedido {
      text-align: center;
      padding: 20px;
    }
    .pedido input {
      padding: 12px 16px;
      border-radius: 25px;
      border: none;
      width: 90%;
      max-width: 400px;
      font-size: 15px;
      margin-top: 10px;
    }
    .pedido button {
      margin-top: 20px;
      background-color: #4f0fff;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #badge {
      background: red;
      color: white;
      padding: 2px 6px;
      border-radius: 50%;
      font-size: 12px;
      margin-left: 4px;
      display: none;
    }
    .profissionais-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin: 30px 0;
    }
    .card-profissional {
      background: white;
      border-radius: 10px;
      padding: 16px;
      width: 90%;
      max-width: 280px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      text-align: left;
    }
    .card-profissional h3 {
      margin: 0 0 10px 0;
    }
    .card-profissional button {
      background-color: #4f0fff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 8px;
      margin-top: 10px;
    }
    .card-profissional button:hover {
      background-color: #3e00cc;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-left">
      <span class="username">Olá, [Nome]!</span>
    </div>
    <div class="nav-links">
      <a href="perfil_cliente.html">👤 Perfil</a>
      <a href="favoritos.html">💜 Favoritos</a>
      <a href="marcacoes_cliente.html">📅 Marcações</a>
      <a href="notificacoes_cliente.html">🔔 Notificações <span id="badge">0</span></a>
      <button class="logout-btn" onclick="logout()">LogOut</button>
    </div>
  </header>

  <h2>Que serviço pretende?</h2>
  <div class="services-buttons">
    <a href="canalizacao.html"><button class="service-btn">Canalização</button></a>
    <a href="eletricidade.html"><button class="service-btn">Eletricidade</button></a>
    <a href="carpintaria.html"><button class="service-btn">Carpintaria</button></a>
    <a href="limpeza.html"><button class="service-btn">Limpeza</button></a>
  </div>

  <div class="pedido">
    <h2>Ou escreva o seu pedido:</h2>
    <input type="text" id="fraseInput" placeholder="Ex: Quero um eletricista no dia 12 de maio às 15h" />
    <br>
    <button onclick="procurarProfissionais()">Procurar</button>
    <div id="resultados" style="margin-top: 30px;"></div>
  </div>
<script>
  const supabase = window.supabase.createClient(
    'https://fqshqdfhmptuvjskptzl.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxc2hxZGZobXB0dXZqc2twdHpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY0NzcxNzEsImV4cCI6MjA2MjA1MzE3MX0.YuDcyfe8v6ff4Y88GuNjDV-CsLz_k1AM4c49ozk-RdY'
  );

  async function logout() {
    await supabase.auth.signOut();
    window.location.href = "login.html";
  }

  async function carregarNomeCliente() {
    const { data: { user } } = await supabase.auth.getUser();
    if (user) {
      const { data, error } = await supabase
        .from('profiles')
        .select('nome')
        .eq('id', user.id)
        .single();
      if (data && data.nome) {
        document.querySelector('.username').innerText = `Olá, ${data.nome}!`;
      }
    }
  }

  async function carregarBadgeNotificacoes() {
    const { data: session } = await supabase.auth.getUser();
    if (!session?.user) return;
    const { data } = await supabase
      .from('agendamentos')
      .select('id')
      .eq('cliente_id', session.user.id)
      .in('estado', ['aceite', 'recusado'])
      .eq('visto_pelo_cliente', false);
    if (data?.length > 0) {
      const badge = document.getElementById("badge");
      badge.innerText = data.length;
      badge.style.display = "inline-block";
    }
  }

  async function procurarProfissionais() {
  const frase = document.getElementById('fraseInput').value.toLowerCase();
  const resultadosDiv = document.getElementById('resultados');
  resultadosDiv.innerHTML = 'A procurar...';

  const dataRegex = /dia\s(\d{1,2})\sde\s(\w+)/i;
  const horaRegex = /às\s([0-9]{1,2})(?::([0-9]{2}))?\s?(da manhã|da tarde|da noite)?/i;
  const horaTextoRegex = /às\s(uma|duas|três|quatro|cinco|seis|sete|oito|nove|dez|onze|meia[-\s]?noite|meio[-\s]?dia)\s?(da manhã|da tarde|da noite)?/i;
  const tipoRegex = /(eletricista[s]?|canalizador[es]?|carpinteiro[s]?|limpeza)/i;

  const meses = {
    janeiro: 0, fevereiro: 1, março: 2, abril: 3, maio: 4, junho: 5,
    julho: 6, agosto: 7, setembro: 8, outubro: 9, novembro: 10, dezembro: 11
  };

  const horasPalavras = {
    uma: 1, duas: 2, três: 3, quatro: 4, cinco: 5, seis: 6, sete: 7,
    oito: 8, nove: 9, dez: 10, onze: 11,
    'meia-noite': 0, 'meia noite': 0, 'meio-dia': 12, 'meio dia': 12
  };

  const dataMatch = frase.match(dataRegex);
  const horaMatch = frase.match(horaRegex);
  const horaTextoMatch = frase.match(horaTextoRegex);
  const tipoMatch = frase.match(tipoRegex);

  if (!dataMatch || (!horaMatch && !horaTextoMatch) || !tipoMatch) {
    resultadosDiv.innerHTML = 'Frase incompleta ou mal interpretada.';
    return;
  }

  const [_, dia, mes] = dataMatch;
  let hora, minuto = 0;

  if (horaMatch) {
    hora = parseInt(horaMatch[1]);
    minuto = parseInt(horaMatch[2] || '0');
    const periodo = horaMatch[3];

    if (periodo === 'da tarde' && hora < 12) hora += 12;
    if (periodo === 'da noite' && hora < 12) hora += 12;
    if (periodo === 'da manhã' && hora === 12) hora = 0;
  } else if (horaTextoMatch) {
    const texto = horaTextoMatch[1];
    hora = horasPalavras[texto] ?? null;
    if (hora === null) {
      resultadosDiv.innerHTML = 'Hora textual não reconhecida.';
      return;
    }
    const periodo = horaTextoMatch[2];
    if ((periodo === 'da tarde' || periodo === 'da noite') && hora < 12) hora += 12;
    if (periodo === 'da manhã' && hora === 12) hora = 0;
  }

  const tipo = tipoMatch[1];

  const dataObj = new Date(2025, meses[mes], parseInt(dia), hora, minuto);
  const agora = new Date();

  if (dataObj < agora) {
    resultadosDiv.innerHTML = 'Não é possível marcar para uma data ou hora já passada.';
    return;
  }

  const especialidadesMap = {
    eletricista: 'eletricidade',
    eletricistas: 'eletricidade',
    canalizador: 'canalizacao',
    canalizadores: 'canalizacao',
    carpinteiro: 'carpintaria',
    carpinteiros: 'carpintaria',
    limpeza: 'limpeza'
  };

  const especialidadeFinal = especialidadesMap[tipo];
  if (!especialidadeFinal) {
    resultadosDiv.innerHTML = 'Especialidade não reconhecida.';
    return;
  }

  const dataISO = dataObj.toISOString().split('T')[0];
  const horaFormatada = `${hora.toString().padStart(2, '0')}:${minuto.toString().padStart(2, '0')}`;

  const { data: profissionais } = await supabase
    .from('profiles')
    .select('*')
    .eq('especialidade', especialidadeFinal)
    .eq('aprovado', true);

  const disponiveis = [];

  for (let prof of profissionais) {
    const { data: agendamentos } = await supabase
      .from('agendamentos')
      .select('*')
      .eq('profissional_id', prof.id)
      .eq('data', dataISO)
      .eq('hora_inicio', horaFormatada)
      .neq('estado', 'rejeitada');

    if (!agendamentos || agendamentos.length === 0) {
      disponiveis.push(prof);
    }
  }

  if (disponiveis.length === 0) {
    resultadosDiv.innerHTML = 'Nenhum profissional disponível.';
  } else {
    resultadosDiv.innerHTML = `
      <h3>Profissionais disponíveis:</h3>
      <div class="profissionais-container">
        ${disponiveis.map(p => `
          <div class="card-profissional">
            <h3>${p.nome} ${p.apelido}</h3>
            <p><strong>Especialidade:</strong> ${p.especialidade}</p>
            <p id="media-${p.id}">A calcular média...</p>
            <button onclick="verPerfil('${p.id}')">Ver perfil</button>
          </div>
        `).join('')}
      </div>
    `;
    calcularMediasAvaliacoes(disponiveis);
  }
}


  async function calcularMediasAvaliacoes(profissionais) {
    for (const p of profissionais) {
      const { data: avaliacoes } = await supabase
        .from('avaliacoes')
        .select('estrelas')
        .eq('profissional_id', p.id);

      const el = document.getElementById(`media-${p.id}`);
      if (!avaliacoes || avaliacoes.length === 0) {
        el.innerText = 'Sem avaliações';
        continue;
      }
      const total = avaliacoes.reduce((sum, a) => sum + a.estrelas, 0);
      const media = (total / avaliacoes.length).toFixed(1);
      const estrelas = [...Array(5)].map((_, i) =>
        `<span style="color:${i < Math.round(media) ? 'gold' : '#ccc'}">★</span>`).join('');
      el.innerHTML = `${estrelas} <small>(${media}/5)</small>`;
    }
  }

  function marcar(profissionalId, data, hora) {
    const url = new URL('marcacao.html', window.location.origin);
    url.searchParams.set('profissionalId', profissionalId);
    url.searchParams.set('data', data);
    url.searchParams.set('hora', hora);
    window.location.href = url.toString();
  }

  function verPerfil(profissionalId) {
    window.location.href = `ver_perfil_prof.html?id=${profissionalId}`;
  }

  carregarNomeCliente();
  carregarBadgeNotificacoes();
</script>
</body>
</html>
