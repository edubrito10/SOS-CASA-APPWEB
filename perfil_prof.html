<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Editar Perfil - SOS Casa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('images/fundo.png') no-repeat center center fixed;
      background-size: cover;
    }

    header {
      background-color: #4f0fff;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
    }

    .logout-btn {
      border: 2px solid white;
      background: none;
      color: white;
      padding: 6px 12px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout-btn:hover {
      background-color: white;
      color: #4f0fff;
    }

    .container {
      max-width: 95%;
      margin: 20px auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .avatar-section {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    #avatar-img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ccc;
    }

    .avatar-buttons button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .avatar-buttons img {
      width: 32px;
      height: 32px;
    }

    #upload-avatar {
      display: none;
    }

    h2, h3 {
      text-align: center;
      color: #333;
      margin-top: 0;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background-color: #4f0fff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #3c0ccc;
    }

    #estado {
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .fotos-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 10px;
    }

    .fotos-preview div {
      position: relative;
    }

    .fotos-preview img {
      width: 100px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .fotos-preview button {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 14px;
      line-height: 24px;
      padding: 0;
      cursor: pointer;
    }

    .avaliacao {
      background: #f9f9f9;
      padding: 10px 15px;
      margin-top: 10px;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      font-size: 14px;
    }

    .avaliacao p {
      margin: 4px 0;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      padding-top: 60px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: rgba(0,0,0,0.8);
    }

    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 80vh;
      border-radius: 10px;
      transition: transform 0.25s ease;
    }

    .modal-close {
      position: absolute;
      top: 30px;
      right: 35px;
      color: white;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 18px;
        width: 100%;
        margin-bottom: 10px;
      }

      .logout-btn {
        font-size: 14px;
        padding: 5px 10px;
      }

      h2, h3 {
        font-size: 18px;
      }

      input, select, textarea, button {
        font-size: 14px;
        padding: 10px;
      }

      .avaliacao {
        font-size: 13px;
      }

      .fotos-preview img {
        width: 80px;
      }

      .avatar-section {
        flex-direction: column;
        text-align: center;
      }

      .avatar-buttons {
        flex-direction: row !important;
        gap: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Editar Perfil</h1>
    <button class="logout-btn" onclick="logout()">LogOut</button>
  </header>

  <div style="padding: 16px;">
    <button onclick="history.back()" style="background-color: #f1e2cd; color: #000; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px;">
      ← Voltar atrás
    </button>
  </div>

  <div class="container">
    <div class="avatar-section">
      <div>
        <img id="avatar-img" src="images/user.png" alt="Avatar">
        <input type="file" id="upload-avatar" accept="image/*" onchange="uploadAvatar()">
      </div>
      <div class="avatar-buttons">
        <button onclick="document.getElementById('upload-avatar').click()">
          <img src="images/editar.png" alt="Editar" title="Editar Foto">
        </button>
        <button onclick="removerAvatar()">
          <img src="images/lixo.png" alt="Remover" title="Remover Foto">
        </button>
      </div>
    </div>
    <div id="estado"></div>

    <label for="distrito">Distrito:</label>
    <select id="distrito" required></select>

    <label for="localidade">Localidade:</label>
    <select id="localidade" required></select>

    <label for="telemovel">Telemóvel:</label>
    <input type="text" id="telemovel">

    <label for="email">Email:</label>
    <input type="email" id="email">

    <button onclick="guardarDescricao()">Guardar Dados</button>

    <h3>Adicionar Foto de Trabalho</h3>
    <input type="file" id="fotoTrabalho" accept="image/*" />
    <button onclick="uploadFoto()">Enviar Foto</button>

    <h3>Fotos Já Enviadas</h3>
    <div class="fotos-preview" id="fotosPreview"></div>

    <h3>Avaliações Recebidas</h3>
    <p id="media-estrelas">A calcular média...</p>
    <div id="avaliacoes">A carregar...</div>
  </div>

  <div id="imgModal" class="modal">
    <span class="modal-close" onclick="fecharModal()">&times;</span>
    <img class="modal-content" id="imgModalContent">
  </div>

  <script>
    const supabase = window.supabase.createClient(
      'https://fqshqdfhmptuvjskptzl.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxc2hxZGZobXB0dXZqc2twdHpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY0NzcxNzEsImV4cCI6MjA2MjA1MzE3MX0.YuDcyfe8v6ff4Y88GuNjDV-CsLz_k1AM4c49ozk-RdY'
    );

    let userId = null;
    let distritosData = {};

    async function logout() {
      await supabase.auth.signOut();
      window.location.href = "login.html";
    }

    async function init() {
      const { data: { user }, error } = await supabase.auth.getUser();
      if (!user || error) return;
      userId = user.id;

      const { data: perfil } = await supabase
        .from('profiles')
        .select('avatar_url, localidade, telemovel, email, fotos_trabalhos')
        .eq('id', userId)
        .single();

      if (perfil?.avatar_url) {
        document.getElementById("avatar-img").src = perfil.avatar_url + `?t=${Date.now()}`;
      }

      if (perfil?.telemovel) document.getElementById("telemovel").value = perfil.telemovel;
      if (perfil?.email) document.getElementById("email").value = perfil.email;

      const response = await fetch("localidades.json");
      distritosData = await response.json();
      const distritoSelect = document.getElementById("distrito");
      distritoSelect.innerHTML = `<option value="">Seleciona o distrito</option>`;
      Object.keys(distritosData).forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        distritoSelect.appendChild(opt);
      });

      distritoSelect.addEventListener("change", () => {
        const localidadeSelect = document.getElementById("localidade");
        localidadeSelect.innerHTML = `<option value="">Seleciona a localidade</option>`;
        (distritosData[distritoSelect.value] || []).forEach(l => {
          const opt = document.createElement("option");
          opt.value = l;
          opt.textContent = l;
          localidadeSelect.appendChild(opt);
        });
      });

      if (perfil?.localidade) {
        const [distrito, localidade] = perfil.localidade.split(" - ");
        distritoSelect.value = distrito;
        distritoSelect.dispatchEvent(new Event("change"));
        document.getElementById("localidade").value = localidade;
      }

      const container = document.getElementById("fotosPreview");
      container.innerHTML = "";
      (perfil.fotos_trabalhos || []).forEach(url => {
        const div = document.createElement("div");
        const img = document.createElement("img");
        img.src = url;

        const btn = document.createElement("button");
        btn.title = "Eliminar";
        btn.onclick = (e) => {
          e.stopPropagation();
          eliminarFoto(url);
        };

        const icon = document.createElement("img");
        icon.src = "images/lixo.png";
        icon.alt = "Eliminar";
        icon.style.width = "20px";
        icon.style.height = "20px";
        btn.appendChild(icon);

        div.appendChild(img);
        div.appendChild(btn);
        container.appendChild(div);
      });

      const { data: avaliacoes } = await supabase
        .from('avaliacoes')
        .select('estrelas, comentario, created_at')
        .eq('profissional_id', userId)
        .order('created_at', { ascending: false });

      const mediaEl = document.getElementById("media-estrelas");
      const avalContainer = document.getElementById("avaliacoes");
      avalContainer.innerHTML = "";

      if (!avaliacoes || avaliacoes.length === 0) {
        mediaEl.innerText = "Ainda sem avaliações.";
        avalContainer.innerHTML = "<p>Ainda não recebeu avaliações.</p>";
      } else {
        const total = avaliacoes.reduce((sum, a) => sum + a.estrelas, 0);
        const media = (total / avaliacoes.length).toFixed(1);
        mediaEl.innerText = `⭐ Média: ${media}/5 (${avaliacoes.length} avaliação${avaliacoes.length > 1 ? 'es' : ''})`;

        avaliacoes.forEach(av => {
          const div = document.createElement("div");
          div.className = "avaliacao";
          div.innerHTML = `
            <p><strong>⭐ ${av.estrelas}</strong></p>
            <p>${av.comentario || "Sem comentário"}</p>
            <small>${new Date(av.created_at).toLocaleDateString()}</small>
          `;
          avalContainer.appendChild(div);
        });
      }
    }

    async function guardarDescricao() {
      const distrito = document.getElementById("distrito").value;
      const localidadeSel = document.getElementById("localidade").value;
      const telemovel = document.getElementById("telemovel").value.trim();
      const email = document.getElementById("email").value.trim();
      const estado = document.getElementById("estado");

      if (!distrito || !localidadeSel) {
        estado.innerText = "Seleciona o distrito e a localidade.";
        estado.style.color = "red";
        return;
      }

      const localidade = `${distrito} - ${localidadeSel}`;
      const { error } = await supabase
        .from('profiles')
        .update({ localidade, telemovel, email })
        .eq('id', userId);

      estado.innerText = error ? "Erro ao guardar." : "Dados atualizados com sucesso!";
      estado.style.color = error ? "red" : "green";
    }

    async function uploadAvatar() {
      const fileInput = document.getElementById("upload-avatar");
      const file = fileInput.files[0];
      if (!file || !userId) return;

      const fileExt = file.name.split(".").pop().toLowerCase();
      const filePath = `avatars/${userId}.${fileExt}`;
      const possibleExts = ["png", "jpg", "jpeg", "webp"];
      const deletePaths = possibleExts.map(ext => `avatars/${userId}.${ext}`);
      await supabase.storage.from('avatars').remove(deletePaths);

      const { error: uploadError } = await supabase
        .storage
        .from('avatars')
        .upload(filePath, file);

      if (uploadError) {
        alert("Erro ao fazer upload da imagem.");
        return;
      }

      const { data } = supabase.storage.from('avatars').getPublicUrl(filePath);
      const publicUrl = data.publicUrl;

      await supabase
        .from("profiles")
        .update({ avatar_url: publicUrl })
        .eq("id", userId);

      document.getElementById("avatar-img").src = publicUrl + `?t=${Date.now()}`;
    }

    async function removerAvatar() {
      if (!userId) return;

      const confirmar = confirm("Tens a certeza que queres remover a tua foto de perfil?");
      if (!confirmar) return;

      const possibleExts = ["png", "jpg", "jpeg", "webp"];
      const deletePaths = possibleExts.map(ext => `avatars/${userId}.${ext}`);
      await supabase.storage.from('avatars').remove(deletePaths);

      await supabase
        .from("profiles")
        .update({ avatar_url: null })
        .eq("id", userId);

      document.getElementById("avatar-img").src = "images/user.png";
    }

    async function uploadFoto() {
      const input = document.getElementById("fotoTrabalho");
      const file = input.files[0];
      const estado = document.getElementById("estado");

      if (!file) {
        estado.innerText = "Escolhe uma imagem primeiro.";
        return;
      }

      const sanitizedName = file.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, "_").replace(/[^a-zA-Z0-9._-]/g, "");
      const filename = `${userId}_${Date.now()}_${sanitizedName}`;
      const filePath = filename;

      const { error: uploadError } = await supabase.storage
        .from('trabalhos')
        .upload(filePath, file);

      if (uploadError) {
        estado.innerText = "Erro ao enviar imagem.";
        return;
      }

      const publicURL = `https://fqshqdfhmptuvjskptzl.supabase.co/storage/v1/object/public/trabalhos/${filePath}`;
      const { data: perfil } = await supabase
        .from('profiles')
        .select('fotos_trabalhos')
        .eq('id', userId)
        .single();

      const novasFotos = [...(perfil?.fotos_trabalhos || []), publicURL];

      const { error: updateError } = await supabase
        .from('profiles')
        .update({ fotos_trabalhos: novasFotos })
        .eq('id', userId);

      if (updateError) {
        estado.innerText = "Erro ao atualizar perfil com a nova foto.";
      } else {
        estado.innerText = "Foto enviada com sucesso!";
        init();
      }
    }

    async function eliminarFoto(url) {
      if (!confirm("Tens a certeza que queres eliminar esta foto?")) return;
      const filename = decodeURIComponent(url.split("/").pop());

      const { error: deleteError } = await supabase.storage
        .from('trabalhos')
        .remove([filename]);

      if (deleteError) {
        alert("Erro ao eliminar do storage.");
        return;
      }

      const { data: perfil } = await supabase
        .from('profiles')
        .select('fotos_trabalhos')
        .eq('id', userId)
        .single();

      const novasFotos = (perfil.fotos_trabalhos || []).filter(f => f !== url);

      const { error: updateError } = await supabase
        .from('profiles')
        .update({ fotos_trabalhos: novasFotos })
        .eq('id', userId);

      if (updateError) {
        alert("Erro ao atualizar perfil.");
      } else {
        alert("Foto eliminada com sucesso.");
        init();
      }
    }

    // Modal com zoom
    let scale = 1;
    let startDist = 0;

    document.getElementById('fotosPreview').addEventListener('click', function (e) {
      if (e.target.tagName === 'IMG') {
        const modal = document.getElementById('imgModal');
        const modalImg = document.getElementById('imgModalContent');
        modal.style.display = 'block';
        modalImg.src = e.target.src;
        scale = 1;
        modalImg.style.transform = `scale(${scale})`;
      }
    });

    function fecharModal() {
      document.getElementById('imgModal').style.display = 'none';
    }

    const modalImg = document.getElementById('imgModalContent');
    modalImg.addEventListener('wheel', function (e) {
      e.preventDefault();
      scale += e.deltaY * -0.001;
      scale = Math.min(Math.max(0.5, scale), 5);
      modalImg.style.transform = `scale(${scale})`;
    });

    modalImg.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) {
        startDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    });

    modalImg.addEventListener('touchmove', function (e) {
      if (e.touches.length === 2) {
        e.preventDefault();
        let newDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        let pinchScale = newDist / startDist;
        scale = Math.min(Math.max(0.5, pinchScale), 5);
        modalImg.style.transform = `scale(${scale})`;
      }
    }, { passive: false });

    init();
  </script>
</body>
</html>
