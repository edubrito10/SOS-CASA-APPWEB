<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Perfil do Cliente - SOS Casa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('images/fundo.png') no-repeat center center fixed;
      background-size: cover;
    }

    header {
      background-color: #4f0fff;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .logout-btn {
      border: 2px solid white;
      background: none;
      color: white;
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .logout-btn:hover {
      background-color: white;
      color: #4f0fff;
    }

    .voltar-btn-container {
      padding: 16px;
    }

    .voltar-btn {
      background-color: #f1e2cd;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .voltar-btn:hover {
      background-color: #e0d1bb;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      margin-bottom: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #4f0fff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #3c0ccc;
    }

    #estado {
      text-align: center;
      font-weight: bold;
      color: #444;
      margin-top: 15px;
    }

    #avatar-img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ccc;
    }

    #upload-avatar {
      display: none;
    }

    .avatar-section {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .avatar-buttons button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .avatar-buttons img {
      width: 32px;
      height: 32px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Perfil do Cliente</h1>
    <button class="logout-btn" onclick="logout()">LogOut</button>
  </header>

  <div class="voltar-btn-container">
    <a href="home_cliente.html">
      <button class="voltar-btn">Voltar à Home</button>
    </a>
  </div>

  <div class="container">

    <!-- Avatar + Botões -->
    <div class="avatar-section">
      <div>
        <img id="avatar-img" src="images/user.png" alt="Avatar">
        <input type="file" id="upload-avatar" accept="image/*" onchange="uploadAvatar()">
      </div>
      <div class="avatar-buttons">
        <button onclick="document.getElementById('upload-avatar').click()">
          <img src="images/editar.png" alt="Editar" title="Editar Foto">
        </button>
        <button onclick="removerAvatar()">
          <img src="images/lixo.png" alt="Remover" title="Remover Foto">
        </button>
      </div>
    </div>

    <h2>Atualize os seus dados</h2>

    <label for="distrito">Distrito:</label>
    <select id="distrito" required></select>

    <label for="localidade">Localidade:</label>
    <select id="localidade" required></select>

    <label for="morada">Morada:</label>
    <input type="text" id="morada" placeholder="Rua, nº, andar, etc.">

    <label for="telemovel">Telemóvel:</label>
    <input type="text" id="telemovel">

    <label for="email">Email:</label>
    <input type="email" id="email">

    <button onclick="guardarDados()">Guardar Dados</button>
    <p id="estado"></p>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      'https://fqshqdfhmptuvjskptzl.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxc2hxZGZobXB0dXZqc2twdHpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY0NzcxNzEsImV4cCI6MjA2MjA1MzE3MX0.YuDcyfe8v6ff4Y88GuNjDV-CsLz_k1AM4c49ozk-RdY'
    );

    let userId = null;
    let distritosData = {};

    async function logout() {
      await supabase.auth.signOut();
      window.location.href = "login.html";
    }

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        document.getElementById("estado").innerText = "Precisas de estar autenticado.";
        return;
      }

      userId = user.id;

      const response = await fetch("localidades.json");
      distritosData = await response.json();

      const distritoSelect = document.getElementById("distrito");
      distritoSelect.innerHTML = `<option value="">Seleciona o distrito</option>`;
      Object.keys(distritosData).forEach(distrito => {
        const option = document.createElement("option");
        option.value = distrito;
        option.textContent = distrito;
        distritoSelect.appendChild(option);
      });

      distritoSelect.addEventListener("change", function () {
        const localidadeSelect = document.getElementById("localidade");
        localidadeSelect.innerHTML = `<option value="">Seleciona a localidade</option>`;
        (distritosData[this.value] || []).forEach(localidade => {
          const option = document.createElement("option");
          option.value = localidade;
          option.textContent = localidade;
          localidadeSelect.appendChild(option);
        });
      });

      const { data, error } = await supabase
        .from('profiles')
        .select('localidade, morada, telemovel, email, avatar_url')
        .eq('id', userId)
        .single();

      if (data) {
        document.getElementById("telemovel").value = data.telemovel || "";
        document.getElementById("email").value = data.email || "";
        document.getElementById("morada").value = data.morada || "";

        if (data.localidade) {
          const [distrito, localidade] = data.localidade.split(" - ");
          document.getElementById("distrito").value = distrito;
          const localidadeSelect = document.getElementById("localidade");
          localidadeSelect.innerHTML = `<option value="">Seleciona a localidade</option>`;
          (distritosData[distrito] || []).forEach(loc => {
            const option = document.createElement("option");
            option.value = loc;
            option.textContent = loc;
            localidadeSelect.appendChild(option);
          });
          localidadeSelect.value = localidade;
        }

        if (data.avatar_url) {
          document.getElementById("avatar-img").src = data.avatar_url + `?t=${Date.now()}`;
        }
      }
    }

    async function guardarDados() {
      const distrito = document.getElementById("distrito").value;
      const localidadeSel = document.getElementById("localidade").value;
      const morada = document.getElementById("morada").value.trim();
      const telemovel = document.getElementById("telemovel").value.trim();
      const email = document.getElementById("email").value.trim();
      const estado = document.getElementById("estado");

      if (!distrito || !localidadeSel) {
        estado.innerText = "Seleciona o distrito e a localidade.";
        estado.style.color = "red";
        return;
      }

      const localidade = `${distrito} - ${localidadeSel}`;

      const { error } = await supabase
        .from('profiles')
        .update({ localidade, morada, telemovel, email })
        .eq('id', userId);

      estado.innerText = error ? "Erro ao guardar." : "Dados atualizados com sucesso!";
      estado.style.color = error ? "red" : "green";
    }

    async function uploadAvatar() {
      const fileInput = document.getElementById("upload-avatar");
      const file = fileInput.files[0];
      if (!file || !userId) return;

      const fileExt = file.name.split(".").pop().toLowerCase();
      const filePath = `avatars/${userId}.${fileExt}`;

      const possibleExts = ["png", "jpg", "jpeg", "webp"];
      const deletePaths = possibleExts.map(ext => `avatars/${userId}.${ext}`);

      await supabase.storage.from('avatars').remove(deletePaths);

      const { error: uploadError } = await supabase
        .storage
        .from('avatars')
        .upload(filePath, file);

      if (uploadError) {
        console.error(uploadError);
        alert("Erro ao fazer upload da imagem.");
        return;
      }

      const { data } = supabase.storage.from('avatars').getPublicUrl(filePath);
      const publicUrl = data.publicUrl;

      await supabase
        .from("profiles")
        .update({ avatar_url: publicUrl })
        .eq("id", userId);

      document.getElementById("avatar-img").src = publicUrl + `?t=${Date.now()}`;
    }

    async function removerAvatar() {
      if (!userId) return;

      const confirmar = confirm("Tens a certeza que queres remover a tua foto de perfil?");
      if (!confirmar) return;

      const possibleExts = ["png", "jpg", "jpeg", "webp"];
      const deletePaths = possibleExts.map(ext => `avatars/${userId}.${ext}`);

      await supabase.storage.from('avatars').remove(deletePaths);

      await supabase
        .from("profiles")
        .update({ avatar_url: null })
        .eq("id", userId);

      document.getElementById("avatar-img").src = "images/user.png";
    }

    init();
  </script>
</body>
</html>
